<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Juana_Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Juana_Blog</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-area" style="text-align: center;">
        <h2>Contact Me</h2>
        <p style="color: #9ca3af; margin-bottom: 2rem;">Have a project in mind or a collaboration opportunity? Please leave your message below.</p>
        
        <form style="max-width: 500px; margin: auto;">
            <div class="form-group">
                <input type="text" placeholder="Full Name">
            </div>
            <div class="form-group">
                <input type="email" placeholder="Email Address">
            </div>
            <div class="form-group">
                <textarea placeholder="Write your message here..." style="height: 120px;"></textarea>
            </div>
            <button type="button" class="btn" style="width: 100%;">Send Message</button>
        </form>
    </main>                         
</body>
